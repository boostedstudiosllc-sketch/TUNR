<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 56 56%22%3E%3Ccircle cx=%2228%22 cy=%2228%22 r=%2226%22 fill=%22none%22 stroke=%22%230080F0%22 stroke-width=%224%22/%3E%3Cpath d=%22M14 32 L22 20 L28 26 L34 18 L42 28 L38 32 Z%22 fill=%22%230080F0%22/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <script>
      // Light or dark mode, before anything draws (see src/lib/theme.js).
      try {
        var t = localStorage.getItem("tunr.theme");
        if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        if (t === "light") {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#F4F4F4");
        }
      } catch (e) {
        console.warn("Couldn't read the theme setting:", e.message);
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="TUNR" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>TUNR — Find Your Meet</title>

    <meta property="og:title" content="TUNR — Find Your Meet" />
    <meta property="og:description" content="Find car meets near you. Discover, RSVP, and post local meets." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TUNR — Find Your Meet" />
    <meta name="twitter:description" content="Find car meets near you. Discover, RSVP, and post local meets." />
    <meta property="og:url" content="https://tunr-gules.vercel.app/" />
    <meta property="og:image" content="https://tunr-gules.vercel.app/icon-512.png" />
    <meta property="og:site_name" content="TUNR" />
    <link rel="canonical" href="https://tunr-gules.vercel.app/" />
    <!-- Tells Google what TUNR is (its search card: name, logo, what it does, who runs it). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://tunr-gules.vercel.app/#org",
            "name": "TUNR",
            "legalName": "Boosted Studios LLC",
            "url": "https://tunr-gules.vercel.app/",
            "logo": "https://tunr-gules.vercel.app/icon-512.png",
            "email": "boostedstudiosllc@gmail.com",
            "areaServed": { "@type": "State", "name": "Georgia" },
            "description": "TUNR is Georgia's car scene app: find car meets near you, RSVP, check in for reward points, show off your garage in 3D and play car games."
          },
          {
            "@type": "WebApplication",
            "name": "TUNR",
            "url": "https://tunr-gules.vercel.app/",
            "applicationCategory": "LifestyleApplication",
            "operatingSystem": "iPhone, Android, web",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "publisher": { "@id": "https://tunr-gules.vercel.app/#org" }
          }
        ]
      }
    </script>
