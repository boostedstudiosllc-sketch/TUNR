name: Apply Supabase migrations

# Runs whenever a migration file lands on the working branch, so schema
# changes ship with the code that needs them instead of waiting to be pasted
# into the SQL editor by hand.

on:
  push:
    branches:
      - main
      - claude/tunr-car-meet-app-f9dqlh
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/migrate.sh"
      - "scripts/db-test.sh"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:
    inputs:
      baseline:
        description: >-
          Mark every migration up to and including this filename as applied
          without running it (e.g. 004_september_events.sql). First run only.
        required: false
        default: ""

# One migration run at a time — two concurrent pushes must not race each
# other into the same database.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  # The policy tests (scripts/db-test.sh) build the schema in a throwaway
  # Postgres and check who can do what. A failure stops the migration from
  # reaching the real database.
  policy-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Run policy tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/db-test.sh

  migrate:
    needs: policy-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          chmod +x scripts/migrate.sh
          ./scripts/migrate.sh
